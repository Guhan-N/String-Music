# Project-wide Gradle settings for high-speed builds and execution.

# Specifies the JVM arguments used for the daemon process.
# Tweaked memory and GC settings for significantly faster compilation and dexing.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Enable parallel task execution across decoupled projects/modules
org.gradle.parallel=true

# Enable build caching to reuse task outputs across runs
org.gradle.caching=true

# Keep the Gradle daemon warm for instant subsequent builds
org.gradle.daemon=true

# Enable File System Watching to skip redundant file scans
org.gradle.vfs.watch=true

# Configure only projects relevant to the requested task
org.gradle.configureondemand=true

# AndroidX package structure
android.useAndroidX=true

# Enable R8 full mode for faster and smaller builds
android.enableR8.fullMode=true

