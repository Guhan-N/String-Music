<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SimpMusic Mini-Player</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Top Bar -->
  <header class="popup-header">
    <div class="brand">
      <div class="brand-logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
      </div>
      <span class="brand-name">SimpMusic</span>
    </div>
    <div class="status-indicator" id="statusIndicator" title="Background Audio Ready">
      <span class="dot"></span>
      <span class="status-text">Background Mode</span>
    </div>
  </header>

  <!-- Search Bar -->
  <div class="search-box">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" color="#94a3b8">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" id="popupSearch" placeholder="Search YouTube Music..." autocomplete="off">
  </div>

  <!-- Content Tabs -->
  <div class="tab-chips">
    <button class="chip active" data-tab="trending">Trending</button>
    <button class="chip" data-tab="lyrics">Lyrics</button>
  </div>

  <!-- Main Scrollable Area -->
  <main class="popup-content">
    <!-- Tracks View -->
    <div id="tracksTab" class="tab-pane active">
      <div class="tracks-list" id="popupTracksList">
        <div class="loading-state">Loading trending songs...</div>
      </div>
    </div>

    <!-- Lyrics View -->
    <div id="lyricsTab" class="tab-pane">
      <div class="popup-lyrics-stream" id="popupLyricsStream">
        <div class="lyrics-placeholder">Play a song to view real-time lyrics</div>
      </div>
    </div>
  </main>

  <!-- Bottom Floating Mini-Player -->
  <footer class="popup-player">
    <div class="player-top">
      <img id="playerThumb" class="player-thumb" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=120&auto=format&fit=crop&q=80" alt="">
      <div class="player-info">
        <div class="player-title" id="playerTitle">No song playing</div>
        <div class="player-artist" id="playerArtist">Search & select a track</div>
      </div>
      <div class="player-controls">
        <button id="popupPrevBtn" class="p-btn" title="Previous">⏮</button>
        <button id="popupPlayBtn" class="p-play-btn" title="Play/Pause">▶</button>
        <button id="popupNextBtn" class="p-btn" title="Next">⏭</button>
      </div>
    </div>

    <!-- Progress Scrubber -->
    <div class="player-bottom">
      <span class="p-time" id="popupCurTime">0:00</span>
      <div class="p-rail" id="popupRail">
        <div class="p-fill" id="popupFill"></div>
      </div>
      <span class="p-time" id="popupDurTime">0:00</span>
    </div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
