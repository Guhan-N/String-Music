<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Icon check</title>
<style>body{background:#111;color:#eee;font-family:sans-serif;padding:20px}
.row{display:flex;gap:28px;flex-wrap:wrap;margin-top:16px}
.cell{text-align:center}.cell img{width:96px;height:96px;border-radius:18px;display:block;margin:0 auto 6px}
.cell img.round{border-radius:50%}.cell img.squircle{border-radius:24%}
h3{margin:26px 0 4px;color:#a855f7}</style></head>
<body>
<h2>String Music — launcher icon assets (as generated)</h2>
<h3>Adaptive-style preview (circle + squircle mask on dark bg)</h3>
<div class="row">
  <div class="cell"><img class="round" src="../mobile/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png"><br>foreground (circle mask)</div>
  <div class="cell"><img class="squircle" src="../mobile/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"><br>ic_launcher</div>
  <div class="cell"><img class="round" src="../mobile/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png"><br>ic_launcher_round</div>
</div>
<h3>PWA / web icons</h3>
<div class="row">
  <div class="cell"><img src="../web/icons/icon-192.png"><br>icon-192</div>
  <div class="cell"><img src="../web/icons/icon-512.png"><br>icon-512</div>
  <div class="cell"><img src="../web/favicon-32.png"><br>favicon-32</div>
</div>
<h3>Master artwork</h3>
<div class="row"><div class="cell"><img src="string-music.png" style="width:220px;height:auto;border-radius:12px"><br>branding/string-music.png</div></div>
</body></html>
